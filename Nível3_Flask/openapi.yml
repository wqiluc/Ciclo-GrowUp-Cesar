# 📄 Mini-documentação da API (OpenAPI 3.0)
#
# 🔗 Como visualizar: cole este arquivo em https://editor.swagger.io
# (Swagger Editor renderiza o YAML como uma documentação interativa)

openapi: 3.0.0

info:
  title: API de Gerenciamento de Tarefas
  description: Documentação da API para o gerenciamento de tarefas (To-Do List)
  version: 1.1.0

servers:
  - url: http://127.0.0.1:5000
    description: Servidor de Desenvolvimento

paths:
  /tasks:
    get:
      summary: Obter todas as tarefas
      responses:
        "200":
          description: Lista de tarefas obtida com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/Task"
                  total_tasks:
                    type: integer

    post:
      summary: Criar nova tarefa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
      responses:
        "201":
          description: Tarefa criada com sucesso

  /tasks/{taskId}:
    get:
      summary: Obter tarefa por ID
      parameters:
        - name: taskId
          in: path
          required: true
          description: ID da tarefa a ser obtida
          schema:
            type: integer
      responses:
        "200":
          description: Tarefa obtida com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Tarefa não encontrada

    put:
      summary: Atualizar tarefa existente
      parameters:
        - name: taskId
          in: path
          required: true
          description: ID da tarefa a ser atualizada
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                completed:
                  type: boolean
      responses:
        "200":
          description: Tarefa atualizada com sucesso

    delete:
      summary: Deletar tarefa existente
      parameters:
        - name: taskId
          in: path
          required: true
          description: ID da tarefa a ser deletada
          schema:
            type: integer
      responses:
        "200":
          description: Tarefa deletada com sucesso

components:
  schemas:
    Task:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        completed:
          type: boolean