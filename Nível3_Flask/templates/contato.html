<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Contato</title>
</head>
<body>
    <h1>Contato</h1>
    <form method="POST">
        <input type="text" name="mensagem" placeholder="Sua mensagem">
        <button type="submit">Enviar</button>
    </form>
    {% if mensagem %}
        <p>Mensagem recebida: {{ mensagem }}</p>
    {% endif %}
    <nav>
        <a href="/">Início</a> |
        <a href="/sobre">Sobre</a> |
        <a href="/contato">Contato</a>
    </nav>
</body>
</html>
